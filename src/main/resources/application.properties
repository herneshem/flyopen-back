# ==========================================
# APPLICATION
# ==========================================

spring.application.name=flyopen-backend


# ==========================================
# POSTGRESQL
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/flyopen
spring.datasource.username=postgres
spring.datasource.password=adminA123

spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# JWT
# ==========================================

jwt.secret=flyopen-super-secret-key-2026-this-must-be-long-enough
jwt.expiration=86400000